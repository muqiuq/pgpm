# Publish the image (as PNMTD's push.yml): a version tag runs "Build and test" (ci.yml, with the deploy test), then builds
# the image for amd64 and arm64 and pushes it with a provenance attestation.
#
#   git tag -a v1.0.0 -m "PGPM 1.0.0" && git push origin v1.0.0
#
# The tag must be "v" + <Version> of Directory.Build.props (the release the app reports). Pre-releases (v1.1.0-rc1) are
# pushed under their tag only, releases also as latest.
#
# Required in the repository's settings (Settings → Secrets and variables → Actions), never in this file:
#   secrets.DOCKERHUB_USERNAME   the Docker Hub account that may push the image
#   secrets.DOCKERHUB_TOKEN      a Docker Hub access token of that account (read & write)
#   vars.IMAGE_NAME              optional: the image, e.g. uisach/pgpm (the default)
name: Publish image

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      deploy: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'uisach/pgpm' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: The tag is the release
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not v${version} (Directory.Build.props): bump the version or fix the tag."
            exit 1
          fi

      # One image for amd64 and arm64: both build stages run on the runner's platform (Dockerfile), only the runtime
      # stage's package install runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # The tag as it is (v1.0.0, what deploy/docker-compose.yml names), and latest unless it is a pre-release.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
